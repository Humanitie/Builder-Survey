<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Builder Field Interview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #f7f5f0; --surface: #fffdf9; --surface-raised: #ffffff;
    --ink: #1e1c17; --text: #3a372f; --muted: #948d7d;
    --line: rgba(30,28,23,0.12); --line-strong: rgba(30,28,23,0.22);
    --accent: #ad8a4e; --accent-strong: #7d5f30; --accent-soft: rgba(173,138,78,0.14); --accent-ink: #2c2210;
    --status-good: #3f6b4f; --status-good-soft: rgba(63,107,79,0.12);
    --status-neutral: #ad8a4e; --status-neutral-soft: rgba(173,138,78,0.14);
    --status-caution: #56677a; --status-caution-soft: rgba(86,103,122,0.12);
    --status-attn: #9c5a3c; --status-attn-soft: rgba(156,90,60,0.12);
    --shadow: 0 1px 2px rgba(30,28,23,0.04), 0 12px 32px -16px rgba(30,28,23,0.18);
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Instrument Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14130f; --surface: #1c1a14; --surface-raised: #211f18;
      --ink: #f4efe4; --text: #cdc6b3; --muted: #8d8672;
      --line: rgba(244,239,228,0.10); --line-strong: rgba(244,239,228,0.20);
      --accent: #d9c08c; --accent-strong: #e9d7a6; --accent-soft: rgba(217,192,140,0.14); --accent-ink: #2c2412;
      --status-good: #74b489; --status-good-soft: rgba(116,180,137,0.14);
      --status-neutral: #d9c08c; --status-neutral-soft: rgba(217,192,140,0.14);
      --status-caution: #93a7ba; --status-caution-soft: rgba(147,167,186,0.14);
      --status-attn: #d38f6c; --status-attn-soft: rgba(211,143,108,0.14);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 20px 40px -20px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14130f; --surface: #1c1a14; --surface-raised: #211f18;
    --ink: #f4efe4; --text: #cdc6b3; --muted: #8d8672;
    --line: rgba(244,239,228,0.10); --line-strong: rgba(244,239,228,0.20);
    --accent: #d9c08c; --accent-strong: #e9d7a6; --accent-soft: rgba(217,192,140,0.14); --accent-ink: #2c2412;
    --status-good: #74b489; --status-good-soft: rgba(116,180,137,0.14);
    --status-neutral: #d9c08c; --status-neutral-soft: rgba(217,192,140,0.14);
    --status-caution: #93a7ba; --status-caution-soft: rgba(147,167,186,0.14);
    --status-attn: #d38f6c; --status-attn-soft: rgba(211,143,108,0.14);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 20px 40px -20px rgba(0,0,0,0.6);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--accent-soft); color: var(--ink); }
  h1, h2, h3 { font-family: var(--font-display); color: var(--ink); margin: 0; text-wrap: balance; }
  .app { min-height: 100%; display: flex; flex-direction: column; align-items: center; padding: 0 20px 40px; }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); width: 100%; max-width: 680px; padding-top: 20px; z-index: 5; background: linear-gradient(var(--bg) 78%, transparent); }
  .rail-track { height: 2px; width: 100%; background: var(--line); border-radius: 2px; overflow: hidden; }
  .rail-fill { height: 100%; width: 0%; background: var(--accent); transition: width .5s cubic-bezier(.65,0,.35,1); }
  .rail-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.02em; color: var(--muted); }
  .rail-meta .mark { font-variant-numeric: tabular-nums; text-align: right; }
  .rail-meta .section-name { color: var(--accent-strong); }
  .back-btn { background: none; border: none; color: var(--muted); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.02em; cursor: pointer; padding: 4px 0; display: flex; align-items: center; gap: 6px; visibility: hidden; }
  .back-btn.show { visibility: visible; }
  .back-btn:hover { color: var(--text); }
  .back-btn svg { width: 12px; height: 12px; }
  .stage { width: 100%; max-width: 680px; flex: 1; display: flex; align-items: center; padding: 32px 0 8px; }
  .screen { width: 100%; animation: rise .5s cubic-bezier(.2,.7,.2,1); }
  @media (prefers-reduced-motion: reduce) { .screen { animation: none; } .rail-fill { transition: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-strong); margin-bottom: 14px; }
  .q-title { font-size: clamp(22px, 3.6vw, 30px); font-weight: 600; line-height: 1.28; }
  .q-sub { margin-top: 10px; font-size: 15px; color: var(--muted); max-width: 56ch; line-height: 1.55; }
  .q-optional { margin-top: 6px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .field { margin-top: 28px; }
  input[type="text"], input[type="email"], textarea {
    width: 100%; font-family: var(--font-body); font-size: 17px; color: var(--ink);
    background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: 10px;
    padding: 14px 16px; outline: none; transition: border-color .2s ease;
  }
  textarea { font-family: var(--font-body); min-height: 130px; resize: vertical; line-height: 1.5; }
  input[type="text"]:focus, input[type="email"]:focus, textarea:focus { border-color: var(--accent); }
  input::placeholder, textarea::placeholder { color: var(--muted); }
  .options { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { font-family: var(--font-body); font-size: 14.5px; color: var(--text); background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: 999px; padding: 11px 18px; cursor: pointer; transition: border-color .15s ease, background .15s ease, color .15s ease, transform .1s ease; display: inline-flex; align-items: center; gap: 8px; }
  .chip:hover { border-color: var(--accent); }
  .chip:active { transform: scale(0.98); }
  .chip.selected { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
  .chip.selected .check { opacity: 1; transform: scale(1); }
  .check { width: 14px; height: 14px; opacity: 0; transform: scale(0.5); transition: all .15s ease; flex-shrink: 0; }
  .chip-list.stacked { flex-direction: column; align-items: stretch; }
  .chip-list.stacked .chip { justify-content: space-between; padding: 14px 18px; }
  .hint { margin-top: 18px; font-size: 12.5px; color: var(--muted); font-family: var(--font-mono); }
  .actions { margin-top: 34px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .btn { font-family: var(--font-body); font-weight: 600; font-size: 15px; border-radius: 8px; padding: 13px 26px; cursor: pointer; border: 1.5px solid transparent; transition: opacity .15s ease, transform .1s ease, background .15s ease; }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--ink); color: var(--bg); }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-primary:not(:disabled):hover { opacity: 0.88; }
  .btn-ghost { background: none; border-color: var(--line-strong); color: var(--text); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent-strong); }
  .skip-note { font-size: 12.5px; color: var(--muted); background: none; border: none; cursor: pointer; font-family: var(--font-body); text-decoration: underline; text-underline-offset: 3px; }
  .skip-note:hover { color: var(--text); }
  .rank-list { margin-top: 26px; display: flex; flex-direction: column; gap: 8px; }
  .rank-item { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .rank-num { font-family: var(--font-mono); font-size: 13px; color: var(--accent-strong); width: 20px; flex-shrink: 0; }
  .rank-label { flex: 1; font-size: 14.5px; color: var(--text); }
  .rank-arrows { display: flex; gap: 4px; }
  .rank-arrows button { width: 30px; height: 30px; border-radius: 6px; border: 1.5px solid var(--line-strong); background: var(--surface-raised); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .rank-arrows button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-strong); }
  .rank-arrows button:disabled { opacity: 0.3; cursor: not-allowed; }
  .rank-arrows svg { width: 14px; height: 14px; }
  .intro { text-align: left; }
  .intro .wordmark { font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: 0.02em; color: var(--accent-strong); display: flex; align-items: center; gap: 10px; margin-bottom: 40px; }
  .intro .wordmark .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .intro h1 { font-size: clamp(30px, 5.6vw, 44px); line-height: 1.14; font-weight: 600; }
  .intro .tagline { font-family: var(--font-display); font-style: italic; color: var(--accent-strong); font-size: 17px; margin-top: 16px; }
  .intro p.body { margin-top: 20px; font-size: 15.5px; line-height: 1.65; color: var(--text); max-width: 58ch; }
  .intro-meta { margin-top: 24px; display: flex; gap: 28px; flex-wrap: wrap; }
  .intro-meta div { display: flex; flex-direction: column; gap: 2px; }
  .intro-meta .k { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .intro-meta .v { font-size: 14px; color: var(--text); font-weight: 500; }
  .section-strip { margin-top: 30px; display: flex; gap: 16px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.02em; }
  .divider { text-align: left; }
  .divider .num { font-family: var(--font-mono); font-size: 46px; color: var(--accent); font-weight: 500; line-height: 1; }
  .divider h2 { margin-top: 14px; font-size: clamp(24px, 4vw, 32px); }
  .divider p { margin-top: 14px; color: var(--muted); font-size: 15px; max-width: 52ch; line-height: 1.6; }
  .recap-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
  .recap-name { font-size: clamp(22px, 4vw, 28px); font-weight: 600; }
  .recap-role { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .highlight-grid { margin-top: 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .highlight-grid { grid-template-columns: 1fr; } }
  .highlight-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow); }
  .highlight-card .hl { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent-strong); }
  .highlight-card .hv { margin-top: 8px; font-family: var(--font-display); font-size: 18px; color: var(--ink); line-height: 1.3; }
  .highlight-card .hv.quote { font-style: italic; font-size: 15px; color: var(--text); }
  .highlight-card.full { grid-column: 1 / -1; }
  .dossier-foot { margin-top: 30px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .confirm { margin-top: 20px; padding: 14px 16px; border-radius: 10px; background: var(--status-good-soft); color: var(--status-good); font-size: 13.5px; display: none; align-items: center; gap: 10px; }
  .confirm.show { display: flex; }
  .fine { margin-top: 22px; font-size: 12px; color: var(--muted); line-height: 1.6; max-width: 58ch; }
  @media (max-width: 480px) { .actions { flex-wrap: wrap; } }
</style>
</head>
<body>
<div class="app">
  <div class="rail" id="rail">
    <div class="rail-track"><div class="rail-fill" id="railFill"></div></div>
    <div class="rail-meta">
      <button class="back-btn" id="backBtn" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        Back
      </button>
      <span class="mark" id="stepMark">Builder Field Interview</span>
    </div>
  </div>
  <div class="stage" id="stage"></div>
</div>
 
<script>
(function(){
  "use strict";
  var answers = {};
  function sec(n, name){ return n + " · " + name; }
 
  var steps = [
    { id: "intro", type: "intro" },
 
    // ---------------- SECTION 1: YOUR PROFESSIONAL IDENTITY ----------------
    { id: "s1", type: "divider", section: "Your Professional Identity", num: "01",
      note: "The basics — nine quick facts before we get into the real conversation." },
    { id: "role", type: "single", eyebrow: sec("01","Professional Identity"), title: "What's your primary role today?",
      options: ["Fractional CEO","Fractional CFO","Fractional COO","Fractional CTO","Fractional CMO","Fractional CRO","Fractional CHRO","Fractional CISO","General Counsel","Advisor","Consultant","Board Member","Other"] },
    { id: "experience", type: "single", eyebrow: sec("01","Professional Identity"), title: "Total years of executive experience?",
      options: ["Under 5 years","5–10 years","10–20 years","20+ years"] },
    { id: "industries", type: "multi", eyebrow: sec("01","Professional Identity"), title: "Which industries have you worked in?", sub: "Select all that apply.",
      options: ["SaaS / Technology","Healthcare & Life Sciences","Financial Services","Manufacturing & Industrial","Government / Public Sector","Consumer & Retail","Energy & Climate","Professional Services","Nonprofit","Other"] },
    { id: "company_sizes", type: "multi", eyebrow: sec("01","Professional Identity"), title: "What size companies do you typically serve?",
      options: ["Pre-seed / seed startups","Series A–C growth companies","Mid-market ($10M–$500M)","Enterprise ($500M+)","Government / public sector","Nonprofit"] },
    { id: "geography", type: "multi", eyebrow: sec("01","Professional Identity"), title: "Where do you work geographically?",
      options: ["North America","Europe","United Kingdom","Middle East","Asia-Pacific","Latin America","Africa","Global — no fixed market"] },
    { id: "specialization", type: "text", eyebrow: sec("01","Professional Identity"), title: "What's your specific niche or specialization?",
      placeholder: "e.g. “Series B SaaS finance operations” or “post-merger integration”", optional: true },
    { id: "fractional_journey", type: "single", eyebrow: sec("01","Professional Identity"), title: "How did you get into fractional work?",
      options: ["Left a full-time executive role deliberately","Was between roles and it stuck","Built up gradually alongside other work","I've always operated this way","Something else"],
      otherTrigger: "Something else", otherPlaceholder: "How would you describe it?" },
    { id: "career_transition", type: "textarea", eyebrow: sec("01","Professional Identity"), title: "Describe your transition into fractional work in a sentence or two.", optional: true,
      placeholder: "Optional — whatever's true, in your own words." },
    { id: "motivation", type: "multi", eyebrow: sec("01","Professional Identity"), title: "What motivated the move to fractional work?", sub: "Select all that apply.",
      options: ["Freedom or autonomy","Variety of problems to solve","Income potential","Escaping corporate politics","Family or lifestyle flexibility","Was between full-time roles","Something else"],
      otherTrigger: "Something else", otherPlaceholder: "What else?" },
 
    // ---------------- SECTION 2: YOUR OPERATING REALITY ----------------
    { id: "s2", type: "divider", section: "Your Operating Reality", num: "02",
      note: "What actually fills your week right now." },
    { id: "week_shape", type: "textarea", eyebrow: sec("02","Operating Reality"), title: "What does a typical week look like for you?", optional: true,
      placeholder: "Optional — broad strokes are fine." },
    { id: "num_clients", type: "single", eyebrow: sec("02","Operating Reality"), title: "How many active clients do you have right now?",
      options: ["0","1","2–3","4 or more"] },
    { id: "time_rank", type: "rank", eyebrow: sec("02","Operating Reality"), title: "Rank these by how much of your time they actually take.", sub: "Most time at the top, least at the bottom.",
      options: ["Delivery","Sales","Marketing","Networking","Administration","Learning","Partnerships"] },
    { id: "heaviest_feeling", type: "textarea", eyebrow: sec("02","Operating Reality"), title: "What part of running your fractional practice feels heavier than it should?", optional: true,
      placeholder: "Optional — this is the one we read most closely." },
 
    // ---------------- SECTION 3: FINDING OPPORTUNITIES ----------------
    { id: "s3", type: "divider", section: "Finding Opportunities", num: "03",
      note: "How work actually reaches you — not how it's supposed to." },
    { id: "lead_sources", type: "multi", eyebrow: sec("03","Finding Opportunities"), title: "What are your current sources of business?", sub: "Select all that apply.",
      options: ["Referrals","LinkedIn","Networking events","Speaking","Content / thought leadership","Staffing agencies","Recruiters","Partnerships","Existing relationships","Government / procurement programs"] },
    { id: "last_client_story", type: "textarea", eyebrow: sec("03","Finding Opportunities"), title: "Walk us through how your last client found you.", optional: true,
      placeholder: "Optional — the real story, not the tidy version." },
    { id: "opportunity_trigger", type: "textarea", eyebrow: sec("03","Finding Opportunities"), title: "What usually triggers a new opportunity for you?", optional: true,
      placeholder: "Optional." },
    { id: "finding_frustration", type: "textarea", eyebrow: sec("03","Finding Opportunities"), title: "What part of finding clients feels most frustrating?", optional: true,
      placeholder: "Optional." },
    { id: "wish_existed", type: "textarea", eyebrow: sec("03","Finding Opportunities"), title: "What do you wish existed to make this easier?", optional: true,
      placeholder: "Optional — dream freely, nothing is off limits here." },
 
    // ---------------- SECTION 4: YOUR PROFESSIONAL NETWORK ----------------
    { id: "s4", type: "divider", section: "Your Professional Network", num: "04",
      note: "Quality over quantity — we want to know who's actually in your corner." },
    { id: "trusted_count", type: "single", eyebrow: sec("04","Professional Network"), title: "How many trusted executives could you call today for real advice?",
      options: ["0","1–3","4–10","10+"] },
    { id: "peer_meeting_frequency", type: "single", eyebrow: sec("04","Professional Network"), title: "How often do you meet with peers?",
      options: ["Rarely","A few times a year","Monthly","Weekly or more"] },
    { id: "advisory_circle", type: "single", eyebrow: sec("04","Professional Network"), title: "Do you have a trusted advisory circle?",
      options: ["Yes, a consistent group","Sort of — informal and shifting","No, not really"] },
    { id: "network_worth", type: "textarea", eyebrow: sec("04","Professional Network"), title: "What makes someone worth keeping in your network?", optional: true,
      placeholder: "Optional." },
 
    // ---------------- SECTION 5: COLLABORATION PATTERNS ----------------
    { id: "s5", type: "divider", section: "Collaboration Patterns", num: "05",
      note: "Do you collaborate, when, why — and why not." },
    { id: "last_partnership_story", type: "textarea", eyebrow: sec("05","Collaboration Patterns"), title: "Describe the last time you partnered with another expert.", optional: true,
      placeholder: "Optional — what the project was, and how it actually went." },
    { id: "partnership_success", type: "textarea", eyebrow: sec("05","Collaboration Patterns"), title: "What made that relationship successful?", optional: true,
      placeholder: "Optional." },
    { id: "collab_prevented", type: "textarea", eyebrow: sec("05","Collaboration Patterns"), title: "What prevented more collaboration — with that person, or in general?", optional: true,
      placeholder: "Optional." },
 
    // ---------------- SECTION 6: TRUST & CREDIBILITY ----------------
    { id: "s6", type: "divider", section: "Trust & Credibility", num: "06",
      note: "How you actually evaluate whether another executive is the real thing." },
    { id: "trust_matters_most", type: "textarea", eyebrow: sec("06","Trust & Credibility"), title: "When deciding whether to trust another executive, what matters most?", optional: true,
      placeholder: "Optional." },
    { id: "trust_rank", type: "rank", eyebrow: sec("06","Trust & Credibility"), title: "Now rank these the same way — most convincing at the top.",
      options: ["Experience","Results","References","Brand","Credentials","Shared connections","Content","Community contribution"] },
 
    // ---------------- SECTION 7: KNOWLEDGE & CONTRIBUTION ----------------
    { id: "s7", type: "divider", section: "Knowledge & Contribution", num: "07",
      note: "What you have that's actually worth sharing." },
    { id: "expertise_share", type: "textarea", eyebrow: sec("07","Knowledge & Contribution"), title: "What expertise could you share with others?", optional: true,
      placeholder: "Optional." },
    { id: "would_contribute", type: "multi", eyebrow: sec("07","Knowledge & Contribution"), title: "Which of these would you actually contribute?", sub: "Select all that apply.",
      options: ["Frameworks","Templates","Mentorship","Introductions","Case studies","Workshops","Research","None of these"],
      exclusive: ["None of these"] },
    { id: "rare_knowledge", type: "textarea", eyebrow: sec("07","Knowledge & Contribution"), title: "What knowledge do you have that others rarely see?", optional: true,
      placeholder: "Optional — the thing you know that took years to learn." },
 
    // ---------------- SECTION 8: GOVERNMENT & ENTERPRISE OPPORTUNITIES ----------------
    { id: "s8", type: "divider", section: "Government & Enterprise Opportunities", num: "08",
      note: "A narrower question about access to bigger tables." },
    { id: "gov_experience", type: "multi", eyebrow: sec("08","Government & Enterprise"), title: "What experience do you have with any of these?", sub: "Select all that apply.",
      options: ["Government contracts","Innovation programs","Superclusters","Procurement","Large enterprise opportunities","Consortiums","None of these"],
      exclusive: ["None of these"] },
    { id: "access_barrier", type: "textarea", eyebrow: sec("08","Government & Enterprise"), title: "What prevents smaller executive firms from accessing larger opportunities?", optional: true,
      placeholder: "Optional." },
 
    // ---------------- SECTION 9: EXISTING TOOLS & PLATFORMS ----------------
    { id: "s9", type: "divider", section: "Existing Tools & Platforms", num: "09",
      note: "What you already use, and where it falls short." },
    { id: "platforms_used", type: "multi", eyebrow: sec("09","Existing Tools & Platforms"), title: "Which of these do you actually use?", sub: "Select all that apply.",
      options: ["LinkedIn","Online communities","Consulting marketplaces (Toptal, Catalant, etc.)","Private networks or masterminds","Professional associations","None of these"],
      exclusive: ["None of these"] },
    { id: "platform_why", type: "textarea", eyebrow: sec("09","Existing Tools & Platforms"), title: "Why those, specifically?", optional: true, placeholder: "Optional.",
      showIf: function(a){ return (a.platforms_used||[]).indexOf("None of these") === -1; } },
    { id: "platform_frustration", type: "textarea", eyebrow: sec("09","Existing Tools & Platforms"), title: "What frustrates you about them?", optional: true, placeholder: "Optional.",
      showIf: function(a){ return (a.platforms_used||[]).indexOf("None of these") === -1; } },
    { id: "platform_wish", type: "textarea", eyebrow: sec("09","Existing Tools & Platforms"), title: "What do you wish they did differently?", optional: true, placeholder: "Optional.",
      showIf: function(a){ return (a.platforms_used||[]).indexOf("None of these") === -1; } },
    { id: "platform_none_why", type: "textarea", eyebrow: sec("09","Existing Tools & Platforms"), title: "What's kept you away from all of these?", optional: true, placeholder: "Optional.",
      showIf: function(a){ return (a.platforms_used||[]).indexOf("None of these") !== -1; } },
 
    // ---------------- SECTION 10: IDEAL EXECUTIVE ECOSYSTEM ----------------
    { id: "s10", type: "divider", section: "Ideal Executive Ecosystem", num: "10",
      note: "Your turn to design it." },
    { id: "perfect_platform", type: "textarea", eyebrow: sec("10","Ideal Ecosystem"), title: "If you could design the perfect platform for fractional leaders, what would exist?", optional: true,
      placeholder: "Optional — take as much space as you need." },
    { id: "ecosystem_priorities", type: "multi", eyebrow: sec("10","Ideal Ecosystem"), title: "Which of these matter most to you?", sub: "Pick up to four.",
      options: ["Profiles","Referrals","Collaboration","Knowledge sharing","Government opportunities","Events","Marketplace","Reputation"], maxSelect: 4 },
 
    // ---------------- SECTION 11: COMMUNITY VALUES ----------------
    { id: "s11", type: "divider", section: "Community Values", num: "11",
      note: "Culture, before anything gets built." },
    { id: "people_around", type: "textarea", eyebrow: sec("11","Community Values"), title: "What type of people do you want around you in a professional community?", optional: true,
      placeholder: "Optional." },
    { id: "behaviors_rewarded", type: "multi", eyebrow: sec("11","Community Values"), title: "What behaviors should be rewarded?", sub: "Select all that apply.",
      options: ["Generosity and mentorship","Follow-through and reliability","Original thinking","Transparency","Delivering results","Collaboration over ego","Something else"],
      otherTrigger: "Something else", otherPlaceholder: "What else should be rewarded?" },
    { id: "behaviors_not_tolerated", type: "multi", eyebrow: sec("11","Community Values"), title: "What behaviors should not be tolerated?", sub: "Select all that apply.",
      options: ["Self-promotion without substance","Gatekeeping or hoarding knowledge","Poaching clients from peers","Dishonesty about experience","Ghosting or flaking","Something else"],
      otherTrigger: "Something else", otherPlaceholder: "What else shouldn't be tolerated?" },
    { id: "defining_values", type: "multi", eyebrow: sec("11","Community Values"), title: "Which two matter most to you, personally?", sub: "Giving mindset, mentorship, collaboration, healthy competition, transparency — pick two.",
      options: ["Giving mindset","Mentorship","Collaboration","Healthy competition","Transparency"], maxSelect: 2 },
 
    // ---------------- SECTION 12: THE FUTURE ----------------
    { id: "s12", type: "divider", section: "The Future", num: "12",
      note: "Last section — where this is all going." },
    { id: "five_year_vision", type: "textarea", eyebrow: sec("12","The Future"), title: "Where do you want your fractional career to be in five years?", optional: true,
      placeholder: "Optional." },
    { id: "support_needed", type: "textarea", eyebrow: sec("12","The Future"), title: "What support would help you get there?", optional: true,
      placeholder: "Optional." },
    { id: "success_definition", type: "textarea", eyebrow: sec("12","The Future"), title: "What does success look like for you?", optional: true,
      placeholder: "Optional — last one." },
 
    { id: "results", type: "result" }
  ];
 
  var current = 0;
  var history = [];
  var stage = document.getElementById("stage");
  var railFill = document.getElementById("railFill");
  var stepMark = document.getElementById("stepMark");
  var backBtn = document.getElementById("backBtn");
 
  function isCountable(s){ return s.type !== "intro" && s.type !== "result" && s.type !== "divider"; }
  function isVisible(s){ return !s.showIf || s.showIf(answers); }
  function visibleTotal(){ return steps.filter(function(s){ return isCountable(s) && isVisible(s); }).length; }
  function stepPosition(idx){ var c=0; for (var i=0;i<idx;i++){ if (isCountable(steps[i]) && isVisible(steps[i])) c++; } return c; }
  function nextIndex(from){
    var i = from + 1;
    while (i < steps.length && !isVisible(steps[i])) i++;
    return Math.min(i, steps.length-1);
  }
  function prevIndex(from){
    var i = from - 1;
    while (i >= 0 && !isVisible(steps[i])) i--;
    return Math.max(i, 0);
  }
  function pad(n){ return n < 10 ? "0"+n : ""+n; }
 
  function updateRail(idx){
    var step = steps[idx];
    if (step.type === "intro"){ railFill.style.width = "0%"; stepMark.textContent = "Builder Field Interview"; backBtn.classList.remove("show"); return; }
    if (step.type === "result"){ railFill.style.width = "100%"; stepMark.textContent = "Complete"; backBtn.classList.remove("show"); return; }
    var total = visibleTotal();
    if (step.type === "divider"){
      stepMark.innerHTML = "Section <span class=\"section-name\">" + step.num + "</span> / 12";
      backBtn.classList.add("show");
      railFill.style.width = Math.round((stepPosition(idx)/total)*100) + "%";
      return;
    }
    var pos = stepPosition(idx) + 1;
    railFill.style.width = Math.round((pos/total)*100) + "%";
    stepMark.textContent = pad(pos) + " / " + pad(total);
    backBtn.classList.add("show");
  }
 
  function render(idx){
    current = idx;
    var step = steps[idx];
    updateRail(idx);
    stage.innerHTML = "";
    var el;
    if (step.type === "intro") el = renderIntro(step);
    else if (step.type === "divider") el = renderDivider(step);
    else if (step.type === "single") el = renderSingle(step);
    else if (step.type === "multi") el = renderMulti(step);
    else if (step.type === "text") el = renderText(step);
    else if (step.type === "textarea") el = renderTextarea(step);
    else if (step.type === "rank") el = renderRank(step);
    else if (step.type === "result") el = renderResult(step);
    stage.appendChild(el);
    window.scrollTo(0,0);
  }
  function goNext(){ var idx = nextIndex(current); history.push(current); render(idx); }
  function goBack(){ if (history.length===0) return; render(history.pop()); }
  backBtn.addEventListener("click", goBack);
 
  function renderIntro(step){
    var wrap = document.createElement("div");
    wrap.className = "screen intro";
    wrap.innerHTML =
      '<div class="wordmark"><span class="dot"></span>BUILDER</div>' +
      '<h1>Tell us how fractional leadership actually works — not how it\'s supposed to.</h1>' +
      '<div class="tagline">Contribution before consumption.</div>' +
      '<p class="body">This is a field interview, not a form. Most of it is open-ended on purpose — we\'d rather have your real week, your real frustrations, and your real network than a tidy set of ratings. Answer what\'s useful to answer and skip the rest; nearly every open question here is optional.</p>' +
      '<div class="intro-meta">' +
        '<div><span class="k">Time</span><span class="v">15–20 minutes, unhurried</span></div>' +
        '<div><span class="k">Privacy</span><span class="v">Used for research only, never sold</span></div>' +
        '<div><span class="k">Why it matters</span><span class="v">This is the raw material Builder gets built from</span></div>' +
      '</div>' +
      '<div class="section-strip"><span>IDENTITY</span><span>OPERATING REALITY</span><span>OPPORTUNITIES</span><span>NETWORK</span><span>COLLABORATION</span><span>TRUST</span><span>CONTRIBUTION</span><span>GOV/ENTERPRISE</span><span>PLATFORMS</span><span>IDEAL ECOSYSTEM</span><span>VALUES</span><span>THE FUTURE</span></div>' +
      '<div class="actions"><button class="btn btn-primary" id="startBtn">Begin</button></div>';
    wrap.querySelector("#startBtn").addEventListener("click", goNext);
    return wrap;
  }
 
  function renderDivider(step){
    var wrap = document.createElement("div");
    wrap.className = "screen divider";
    wrap.innerHTML = '<div class="num">' + step.num + '</div><h2>' + step.section + '</h2><p>' + step.note + '</p>' +
      '<div class="actions"><button class="btn btn-primary" id="contBtn">Continue</button></div>';
    wrap.querySelector("#contBtn").addEventListener("click", goNext);
    return wrap;
  }
 
  function screenShell(step, bodyHtml){
    var wrap = document.createElement("div");
    wrap.className = "screen";
    wrap.innerHTML = '<div class="eyebrow">' + step.eyebrow + '</div>' +
      '<h2 class="q-title">' + step.title + '</h2>' +
      (step.sub ? '<div class="q-sub">' + step.sub + '</div>' : '') +
      (step.optional ? '<div class="q-optional">Optional</div>' : '') +
      bodyHtml;
    return wrap;
  }
 
  function renderSingle(step){
    var optsHtml = step.options.map(function(label, i){
      return '<button class="chip" data-i="' + i + '"><span>' + label + '</span>' +
        '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></button>';
    }).join("");
    var stacked = step.options.length > 6 ? " stacked" : "";
    var extra = step.otherTrigger ? '<div class="field" id="otherField" style="display:none"><input type="text" id="otherInput" placeholder="' + (step.otherPlaceholder||"") + '"></div><div class="actions" id="otherActions" style="display:none"><button class="btn btn-primary" id="otherCont">Continue</button></div>' : '';
    var wrap = screenShell(step, '<div class="options chip-list' + stacked + '">' + optsHtml + '</div>' + extra);
    var chips = wrap.querySelectorAll(".chip");
    chips.forEach(function(chip){
      chip.addEventListener("click", function(){
        var i = parseInt(chip.getAttribute("data-i"), 10);
        var label = step.options[i];
        answers[step.id] = label;
        chips.forEach(function(c){ c.classList.remove("selected"); });
        chip.classList.add("selected");
        if (step.otherTrigger && label === step.otherTrigger){
          wrap.querySelector("#otherField").style.display = "block";
          wrap.querySelector("#otherActions").style.display = "flex";
          wrap.querySelector("#otherInput").focus();
          return;
        }
        setTimeout(goNext, 220);
      });
    });
    if (step.otherTrigger){
      wrap.querySelector("#otherCont").addEventListener("click", function(){
        answers[step.id + "_other"] = wrap.querySelector("#otherInput").value.trim();
        goNext();
      });
    }
    return wrap;
  }
 
  function renderMulti(step){
    var selected = answers[step.id] || [];
    var optsHtml = step.options.map(function(label, i){
      var isSel = selected.indexOf(label) !== -1;
      return '<button class="chip' + (isSel ? " selected" : "") + '" data-l="' + label.replace(/"/g,"&quot;") + '"><span>' + label + '</span>' +
        '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></button>';
    }).join("");
    var showOther = step.otherTrigger && selected.indexOf(step.otherTrigger) !== -1;
    var extra = step.otherTrigger ? '<div class="field" id="otherField" style="display:' + (showOther?"block":"none") + '"><input type="text" id="otherInput" placeholder="' + (step.otherPlaceholder||"") + '" value="' + (answers[step.id+"_other"]||"") + '"></div>' : '';
    var wrap = screenShell(step,
      '<div class="options">' + optsHtml + '</div>' + extra +
      '<div class="actions"><button class="btn btn-primary" id="contBtn">Continue</button><span class="skip-note" id="skipLink" style="text-decoration:none;cursor:default;color:var(--muted)">Select as many as apply</span></div>');
    var chips = wrap.querySelectorAll(".chip");
    chips.forEach(function(chip){
      chip.addEventListener("click", function(){
        var label = chip.getAttribute("data-l");
        var list = answers[step.id] || [];
        var exclusive = step.exclusive || [];
        if (exclusive.indexOf(label) !== -1){
          list = list.indexOf(label) !== -1 ? [] : [label];
        } else {
          list = list.filter(function(l){ return exclusive.indexOf(l) === -1; });
          var pos = list.indexOf(label);
          if (pos !== -1) { list.splice(pos, 1); }
          else {
            if (step.maxSelect && list.length >= step.maxSelect) return;
            list.push(label);
          }
        }
        answers[step.id] = list;
        chips.forEach(function(c){ c.classList.toggle("selected", list.indexOf(c.getAttribute("data-l")) !== -1); });
        if (step.otherTrigger){
          var f = wrap.querySelector("#otherField");
          if (f) { f.style.display = list.indexOf(step.otherTrigger) !== -1 ? "block" : "none"; }
        }
      });
    });
    wrap.querySelector("#contBtn").addEventListener("click", function(){
      if (step.otherTrigger){
        var oi = wrap.querySelector("#otherInput");
        if (oi) answers[step.id + "_other"] = oi.value.trim();
      }
      goNext();
    });
    return wrap;
  }
 
  function renderText(step){
    var wrap = screenShell(step,
      '<div class="field"><input type="text" id="textInput" placeholder="' + (step.placeholder||"") + '" autocomplete="off"></div>' +
      '<div class="actions"><button class="btn btn-primary" id="contBtn"' + (step.optional?"":" disabled") + '>Continue</button>' +
      (step.optional ? '<span class="skip-note" id="skipBtn">Skip this one</span>' : '') + '</div>');
    var input = wrap.querySelector("#textInput");
    var btn = wrap.querySelector("#contBtn");
    if (answers[step.id]) input.value = answers[step.id];
    if (!step.optional){ input.addEventListener("input", function(){ btn.disabled = input.value.trim().length===0; }); }
    input.addEventListener("keydown", function(e){ if (e.key==="Enter" && !btn.disabled){ answers[step.id]=input.value.trim(); goNext(); } });
    btn.addEventListener("click", function(){ answers[step.id] = input.value.trim(); goNext(); });
    var skip = wrap.querySelector("#skipBtn");
    if (skip) skip.addEventListener("click", function(){ answers[step.id] = ""; goNext(); });
    setTimeout(function(){ input.focus(); }, 50);
    return wrap;
  }
 
  function renderTextarea(step){
    var wrap = screenShell(step,
      '<div class="field"><textarea id="taInput" placeholder="' + (step.placeholder||"") + '"></textarea></div>' +
      '<div class="actions"><button class="btn btn-primary" id="contBtn"' + (step.optional?"":" disabled") + '>Continue</button>' +
      (step.optional ? '<span class="skip-note" id="skipBtn">Skip this one</span>' : '') + '</div>');
    var ta = wrap.querySelector("#taInput");
    var btn = wrap.querySelector("#contBtn");
    if (answers[step.id]) ta.value = answers[step.id];
    if (!step.optional){ ta.addEventListener("input", function(){ btn.disabled = ta.value.trim().length===0; }); }
    btn.addEventListener("click", function(){ answers[step.id] = ta.value.trim(); goNext(); });
    var skip = wrap.querySelector("#skipBtn");
    if (skip) skip.addEventListener("click", function(){ answers[step.id] = ""; goNext(); });
    setTimeout(function(){ ta.focus(); }, 50);
    return wrap;
  }
 
  function renderRank(step){
    var order = answers[step.id] ? answers[step.id].slice() : step.options.slice();
    function draw(){
      list.innerHTML = order.map(function(label, i){
        return '<div class="rank-item" data-i="' + i + '"><span class="rank-num">' + (i+1) + '</span><span class="rank-label">' + label + '</span>' +
          '<span class="rank-arrows"><button data-dir="up" ' + (i===0?"disabled":"") + '><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 15l-6-6-6 6"/></svg></button>' +
          '<button data-dir="down" ' + (i===order.length-1?"disabled":"") + '><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></button></span></div>';
      }).join("");
      list.querySelectorAll(".rank-item").forEach(function(item){
        var i = parseInt(item.getAttribute("data-i"),10);
        item.querySelectorAll("button").forEach(function(btn){
          btn.addEventListener("click", function(){
            var dir = btn.getAttribute("data-dir");
            var sw = dir==="up" ? i-1 : i+1;
            var t = order[i]; order[i]=order[sw]; order[sw]=t;
            draw();
          });
        });
      });
    }
    var wrap = screenShell(step, '<div class="rank-list" id="rankList"></div><div class="actions"><button class="btn btn-primary" id="contBtn">Continue</button></div>');
    var list = wrap.querySelector("#rankList");
    draw();
    wrap.querySelector("#contBtn").addEventListener("click", function(){ answers[step.id] = order; goNext(); });
    return wrap;
  }
 
  function escapeHtml(str){ var d = document.createElement("div"); d.textContent = str; return d.innerHTML; }
 
  function renderResult(step){
    var role = answers.role || "Fractional Executive";
    var niche = answers.specialization;
    var topTime = (answers.time_rank && answers.time_rank[0]) || "—";
    var bottomTime = (answers.time_rank && answers.time_rank[answers.time_rank.length-1]) || "—";
    var topTrust = (answers.trust_rank && answers.trust_rank[0]) || "—";
    var contributeCount = (answers.would_contribute || []).filter(function(l){ return l !== "None of these"; }).length;
    var vision = answers.five_year_vision;
 
    var cards = [];
    cards.push({ label: "Role", value: role + (niche ? " — " + niche : ""), full: false });
    cards.push({ label: "Where your time actually goes", value: topTime + " takes the most, " + bottomTime + " the least", full: false });
    cards.push({ label: "What convinces you to trust someone", value: topTrust, full: false });
    cards.push({ label: "Contribution appetite", value: contributeCount + " of 7 — " + (contributeCount >= 4 ? "genuinely generous" : contributeCount >= 1 ? "selectively willing" : "not right now"), full: false });
    if (vision) cards.push({ label: "Five years from now, in your words", value: '“' + vision + '”', full: true, quote: true });
 
    var cardsHtml = cards.map(function(c){
      return '<div class="highlight-card' + (c.full?" full":"") + '"><div class="hl">' + c.label + '</div><div class="hv' + (c.quote?" quote":"") + '">' + escapeHtml(c.value) + '</div></div>';
    }).join("");
 
    var wrap = document.createElement("div");
    wrap.className = "screen dossier";
    wrap.innerHTML =
      '<div class="eyebrow">Builder Field Interview — Recap</div>' +
      '<div class="recap-head"><div><div class="recap-name">Thank you</div><div class="recap-role">Here\'s what we heard, reflected back.</div></div></div>' +
      '<div class="highlight-grid">' + cardsHtml + '</div>' +
      '<div class="dossier-foot">' +
        '<button class="btn btn-primary" id="requestBtn">Submit my interview</button>' +
        '<button class="btn btn-ghost" id="restartBtn">Start over</button>' +
      '</div>' +
      '<div class="confirm" id="confirmBox"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>Received — this is exactly the kind of raw material Builder needs before writing another line of product.</div>' +
      '<div class="fine">This is a working preview of Builder\'s field interview. Nothing is scored here on purpose — the value of this instrument is qualitative. All answers stay in your browser; nothing is transmitted or stored anywhere yet. Wire this to a form backend before running it with real respondents.</div>';
 
    wrap.querySelector("#restartBtn").addEventListener("click", function(){ answers = {}; history = []; render(0); });
    wrap.querySelector("#requestBtn").addEventListener("click", function(e){
      wrap.querySelector("#confirmBox").classList.add("show");
      e.target.setAttribute("disabled","true");
    });
    return wrap;
  }
 
  render(0);
})();
</script>
</body>
</html>
